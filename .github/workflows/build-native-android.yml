# Build Native Android OpenCode via transplant pipeline
#
# Diagnostic/handoff workflow (attempt-based evidence, NOT a release path):
#   1. npm pack opencode-linux-arm64@<ver>
#   2. Download official android Bun (target from tools/transplant/config/bun-bind.json)
#   3. Run tools/transplant/transplant.py all --no-execve
#      (x86 build host cannot exec aarch64 ELF; produces binary + report only)
#   4. Golden regression (tests/transplant/test_golden.py)
#   5. Upload artifacts/transplant/ + write status/*.json (attempt evidence)
#
# Final runtime acceptance happens on a real Termux aarch64 device, not here.

name: Build Native Android (transplant)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "opencode version (e.g. 1.18.31)"
        required: false
        default: "1.18.31"

env:
  BUN_BIND_JSON: tools/transplant/config/bun-bind.json

jobs:
  transplant:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VER: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Echo resolved inputs (evidence)
        run: |
          set -euo pipefail
          echo "inputs.version=${{ inputs.version }}"
          echo "github.event.inputs.version=${{ github.event.inputs.version }}"
          echo "OPENCODE_VER=$OPENCODE_VER"
          echo "GITHUB_SHA=$GITHUB_SHA"
          if [ -z "$OPENCODE_VER" ]; then
            echo "ERROR: resolved version is empty (input did not propagate)" >&2
            exit 1
          fi

      - name: Prepare directories
        run: |
          mkdir -p out/status out/logs work
          python3 --version
          npm --version

      - name: Resolve android Bun target from bun-bind.json
        id: bun
        run: |
          BUN_VER="$(python3 -c 'import json;print(json.load(open("tools/transplant/config/bun-bind.json"))["target"])')"
          echo "bun_ver=$BUN_VER" >> "$GITHUB_OUTPUT"
          echo "bound bun target: $BUN_VER"

      - name: Probe latest android Bun (diagnostic, non-blocking)
        continue-on-error: true
        run: |
          bash scripts/ci/probe-latest-bun.sh --offline
          bash scripts/ci/probe-latest-bun.sh 2>&1 | tail -8 || true

      - name: Download opencode tgz
        run: |
          set -euo pipefail
          VER="${OPENCODE_VER:?OPENCODE_VER is empty (input did not propagate)}"
          echo "packing opencode-linux-arm64@$VER"
          npm pack "opencode-linux-arm64@$VER" --pack-destination work/
          ls -la work/
          test -f "work/opencode-linux-arm64-$VER.tgz" || {
            echo "ERROR: expected work/opencode-linux-arm64-$VER.tgz not found" >&2
            exit 1
          }

      # NOTE: intentionally NO pre-staging of the android Bun zip here.
      # transplant.py pins its own BUN_URL and downloads idempotently into its
      # own cache dir. Pre-seeding artifacts/transplant/android-bun/ collides
      # with that cache path (known cache-path collision): the pipeline then
      # skips its own download and silently grafts whatever base was seeded.
      # The default revive mode is `reloc`, which requires a <=1.3.x base
      # (reloc+1.4.0 = SIGSEGV at runtime despite sha self-consistency);
      # letting the pipeline self-download keeps base and mode matched.

      - name: Run transplant pipeline (--no-execve)
        run: |
          set -euo pipefail
          VER="${OPENCODE_VER:?OPENCODE_VER is empty (input did not propagate)}"
          TGZ="work/opencode-linux-arm64-$VER.tgz"
          test -f "$TGZ" || {
            echo "ERROR: tgz $TGZ missing (version/artifact mismatch)" >&2
            ls -la work/ >&2 || true
            exit 1
          }
          python3 tools/transplant/transplant.py all --ver "$VER" --tgz "$TGZ" --no-execve
          ls -la artifacts/transplant/"$VER"/

      # NOTE: no separate revive step here. `transplant.py all` already runs the
      # revive graft internally (cmd_all step 6) and records it in report.json
      # steps.revive; re-running revive_patch.py with a manually computed
      # --size-mode overwrote that verified output and broke artifact vs
      # report.json self-consistency (double-revive bug, fixed 2026-08-25).
      # Size-mode knowledge for manual debugging: revive_patch.py default is
      # `reloc`; bun >= 1.4 base may need `plain-offset` -- let transplant.py's
      # internal logic decide, do not guess in CI.

      - name: Ensure golden fixtures
        run: |
          if [ -z "$(ls -A tests/transplant/fixtures/tgz/ 2>/dev/null)" ]; then
            echo "fixtures missing; fetching..."
            bash scripts/fetch-fixtures.sh
          else
            echo "fixtures present:"
            ls tests/transplant/fixtures/tgz/
          fi

      - name: Run golden regression
        run: |
          python3 tests/transplant/test_golden.py --fixtures-dir tests/transplant/fixtures/tgz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transplant-${{ inputs.version }}
          path: artifacts/transplant/${{ inputs.version }}/
          retention-days: 30

      - name: Write status (attempt-based evidence)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ver = "${{ inputs.version }}"
          out = Path("artifacts/transplant") / ver
          report = json.loads((out / "report.json").read_text()) if (out / "report.json").is_file() else {}
          assets = sorted(str(p.relative_to(Path("artifacts"))) for p in out.rglob("*") if p.is_file())
          Path("out/status/transplant-attempt.json").write_text(json.dumps({
            "status": "completed",
            "ver": ver,
            "attempt": "evidence-only (not a release)",
            "execve_result": report.get("steps", {}).get("verify", {}).get("execve_result", "n/a"),
            "layout": report.get("layout"),
            "artifacts": assets,
          }, indent=2) + "\n")
          PY
          cat out/status/transplant-attempt.json
